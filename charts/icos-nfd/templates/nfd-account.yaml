apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-ac
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfd-cr
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods/log", "pods"]  
  verbs: ["get", "list", "watch"]
- apiGroups: [""] 
  resources: ["nodes", "nodes/status"] 
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nfd-ac
subjects:
  - kind: ServiceAccount
    name: nfd-ac
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: nfd-cr
  apiGroup: rbac.authorization.k8s.io